name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Loquara is a Windows application. The engine links sherpa-onnx with the
# DirectML provider and the platform layer talks to the Win32 API directly,
# so there is no Linux build to keep green — only one that would fail.
env:
  CMAKE_GENERATOR: Ninja

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # sherpa-onnx builds with CMake and needs a careful pair of decisions.
      # Its scripts do not survive CMake 4 — `string(REPLACE)` is handed an
      # empty variable and configuring dies before a file compiles — so CMake
      # stays on the 3.x line the library is written against. That line in
      # turn knows nothing about the Visual Studio the runner ships, which
      # moves without warning, so the build goes through Ninja instead and
      # stops caring which Visual Studio is installed.
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Frontend tests
        run: pnpm test

      # Ignored tests reach the model host; they are the ones that would catch
      # a repository moving or a file being renamed, so they run here too.
      - name: Rust tests
        working-directory: src-tauri
        run: |
          cargo test --release
          cargo test --release -- --ignored --skip transcribes

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # sherpa-onnx builds with CMake and needs a careful pair of decisions.
      # Its scripts do not survive CMake 4 — `string(REPLACE)` is handed an
      # empty variable and configuring dies before a file compiles — so CMake
      # stays on the 3.x line the library is written against. That line in
      # turn knows nothing about the Visual Studio the runner ships, which
      # moves without warning, so the build goes through Ninja instead and
      # stops caring which Visual Studio is installed.
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tauri build

      # Releases are published deliberately, not as a side effect of pushing a
      # tag: a draft raised here would race whatever is already published.
      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
