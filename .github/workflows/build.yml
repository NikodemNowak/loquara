name: ci

# A push to main is what publishes caches that other branches can restore.
# Caches saved on a feature branch stay invisible to main. Running on every
# push and on pull_request also executes this workflow twice for one commit.
on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# A newer push replaces an in-progress PR run. Main is left running so the
# shared cache is still uploaded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check versions agree
        run: node scripts/check-version.mjs

      - name: Type check
        run: pnpm tsc -b

      - name: Frontend tests
        run: pnpm test

      - name: Packaging configuration tests
        run: python3 -m unittest tests.test_packaging_config -v

  rust:
    name: rust (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libxdo-dev \
            libx11-dev \
            libdbus-1-dev \
            libssl-dev \
            cmake

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # `tauri::generate_context!` embeds the frontend, so it has to exist
      # before the Rust tests can compile.
      - name: Build frontend
        run: pnpm build

      # Windows builds sherpa-onnx from source (DirectML). The installed
      # libraries are cached on their own: rust-cache removes this path
      # dependency because it sits inside src-tauri. SHERPA_LIB_PATH tells
      # the build script to link those libraries instead of running CMake.
      - name: Cache Windows speech engine
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: src-tauri/.sherpa-directml
          key: sherpa-directml-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/vendor/sherpa-rs-sys/**') }}

      # The app's build script stages the engine libraries, and Cargo does not
      # order it after sherpa-rs-sys. Building the engine first is what makes
      # the staging deterministic.
      - name: Build speech engine
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ] && node scripts/sherpa-directml-cache.mjs check; then
            export SHERPA_LIB_PATH="$(node scripts/sherpa-directml-cache.mjs print)"
          fi
          cargo build --manifest-path src-tauri/Cargo.toml -p sherpa-rs-sys
          if [ "$RUNNER_OS" = "Windows" ] && ! node scripts/sherpa-directml-cache.mjs check; then
            node scripts/sherpa-directml-cache.mjs capture
          fi

      - name: Rust tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ] && node scripts/sherpa-directml-cache.mjs check; then
            export SHERPA_LIB_PATH="$(node scripts/sherpa-directml-cache.mjs print)"
          fi
          cargo test --manifest-path src-tauri/Cargo.toml --lib
