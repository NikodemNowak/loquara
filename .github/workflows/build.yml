name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Loquara is a Windows application. The engine links sherpa-onnx with the
# DirectML provider and the platform layer talks to the Win32 API directly,
# so there is no Linux build to keep green — only one that would fail.
# Pinned rather than `windows-latest`: sherpa-onnx asks the operating system
# what it is by running `wmic`, which newer Windows images no longer ship, and
# its CMake dies on the empty answer. The same image also carries a Visual
# Studio that CMake 3.x knows how to drive.
jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # No Rust cache on purpose. It restores the compiled sherpa-rs-sys
      # without the libraries that crate's build script produced, so the
      # bundler is handed nothing to package and the build fails on a cache
      # hit but passes on a miss. Ten minutes of rebuilding beats that.

      # sherpa-onnx is built from source — the published binaries have no
      # DirectML build, and the crate refuses to pair them with it. Its CMake
      # scripts also do not survive CMake 4, where `string(REPLACE)` is handed
      # an empty variable and configuring dies before a file compiles.
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Frontend tests
        run: pnpm test

      # Ignored tests reach the model host; they are the ones that would catch
      # a repository moving or a file being renamed, so they run here too.
      - name: Rust tests
        working-directory: src-tauri
        run: |
          cargo test --release
          cargo test --release -- --ignored --skip transcribes

  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # No Rust cache on purpose. It restores the compiled sherpa-rs-sys
      # without the libraries that crate's build script produced, so the
      # bundler is handed nothing to package and the build fails on a cache
      # hit but passes on a miss. Ten minutes of rebuilding beats that.

      # sherpa-onnx is built from source — the published binaries have no
      # DirectML build, and the crate refuses to pair them with it. Its CMake
      # scripts also do not survive CMake 4, where `string(REPLACE)` is handed
      # an empty variable and configuring dies before a file compiles.
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tauri build

      # Releases are published deliberately, not as a side effect of pushing a
      # tag: a draft raised here would race whatever is already published.
      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
