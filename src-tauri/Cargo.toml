[package]
name = "loquara"
version = "0.2.0"
description = "Lokalna aplikacja do dyktowania"
edition = "2024"
rust-version = "1.95"
build = "build.rs"

[lib]
name = "loquara_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
arboard = "3"
cpal = "0.16"
hound = "3.5"
# Windows Credential Manager only. The default features also pull in a
# Linux secret-service backend, which the CI Linux build has no use for and
# which drags zbus into the tree; on that platform Entry::new simply reports
# that no store is available and the token is treated as absent.
keyring = { version = "3", default-features = false, features = ["windows-native"] }
regex = "1.11"
rubato = "0.16"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-rs = "0.6"
tauri = { version = "2.11.5", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
ureq = { version = "2", features = ["tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Media_Audio",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = "2.6.3"
