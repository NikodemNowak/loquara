[package]
name = "mow"
version = "0.1.0"
description = "Lokalna aplikacja do dyktowania na Windows"
edition = "2024"
rust-version = "1.95"
build = "build.rs"

[lib]
name = "mow_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2.11.5"

[build-dependencies]
tauri-build = "2.6.3"
